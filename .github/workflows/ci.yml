name: CI

# Regression gate on every push and PR: the full backend test suite, plus a
# smoke run of the extraction eval harness in mock mode (no API keys, no personal
# data) so the whole pipeline — read -> VAT/amount logic -> gate -> scoring ->
# guardrail metrics — is exercised end-to-end offline.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Eval harness smoke test (mock provider)
        # No secrets: the mock provider returns a deterministic receipt, scored
        # against a committed fixture. Non-zero exit fails the build. Outputs are
        # redirected to throwaway *.mock.json so the committed real metrics.json /
        # RESULTS.md baseline is never clobbered in the runner.
        run: >
          python scripts/eval_extraction.py
          --provider mock
          --labels eval/labels.mock.json
          --receipts eval/fixtures
          --metrics-out eval/metrics.mock.json
          --results-out eval/RESULTS.mock.md
          --detail-out eval/results.detail.mock.json

      - name: Accuracy-regression gate (mock mechanism)
        # Gates the deterministic mock score against a committed floor. This can't
        # verify the real accuracy number (the labelled set is git-ignored personal
        # data), but it catches a code change that silently breaks the scoring / VAT /
        # gate pipeline. The real-number gate runs locally on cached reads against
        # eval/baseline.json — see backend/eval/README.md.
        run: >
          python scripts/check_regression.py
          --metrics eval/metrics.mock.json
          --baseline eval/baseline.mock.json

      - name: Chatbot eval — offline check (deterministic)
        # The chatbot answers via tool-calling over a fixed synthetic ledger (D40); the
        # ledger + labelled questions are committed (synthetic, no PII), so this runs
        # fully offline. --check dispatches each question's expected tool over the ledger
        # and verifies the computed figure — no API key, no model. It measures
        # answer_correctness (the analytics surface); the model-dependent tool-selection /
        # refusal numbers run locally against eval/chatbot/baseline.json.
        run: >
          python scripts/eval_chatbot.py --check
          --metrics-out eval/chatbot/metrics.mock.json
          --results-out eval/chatbot/RESULTS.mock.md
          --detail-out eval/chatbot/results.detail.mock.json

      - name: Chatbot eval — regression gate (deterministic)
        run: >
          python scripts/check_regression.py
          --metrics eval/chatbot/metrics.mock.json
          --baseline eval/chatbot/baseline.mock.json
