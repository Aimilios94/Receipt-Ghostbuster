name: CI

# Regression gate on every push and PR: the full backend test suite, plus a
# smoke run of the extraction eval harness in mock mode (no API keys, no personal
# data) so the whole pipeline — read -> VAT/amount logic -> gate -> scoring ->
# guardrail metrics — is exercised end-to-end offline.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Eval harness smoke test (mock provider)
        # No secrets: the mock provider returns a deterministic receipt, scored
        # against a committed fixture. Non-zero exit fails the build. The RESULTS.md
        # / metrics.json it writes are throwaway in the runner (never committed).
        run: >
          python scripts/eval_extraction.py
          --provider mock
          --labels eval/labels.mock.json
          --receipts eval/fixtures
